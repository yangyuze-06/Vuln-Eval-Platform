# VEP CWE Manifest
# 用途：统一索引和管理 VEP 中所有 CWE 的规则、测试、实验路径
# 状态：Phase 1 - 只读索引，不改变现有行为
# 维护：新增 CWE 时只需在此文件添加一个条目

version: "1.0"
updated: "2026-06-11"

# Ground Truth 配置
ground_truth:
  file: expectedresults-1.2.csv
  format: owasp_benchmark_1.2

# 数据库路径
databases:
  codefuse: dataset/codefuse-db
  codeql: dataset/codeql-db

