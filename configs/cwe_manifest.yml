      analysis_file: rules/codefuse-query/CWE-022/analysis.md
    codeql:
      rule_directory: rules/codeql-query/CWE-022
    tests:
      directory: tests/codefuse-query/java/cwe022
      positive_pattern: "*Positive.java"
      negative_pattern: "*Negative.java"
    experiments:
